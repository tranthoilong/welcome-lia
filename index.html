<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grand Opening - Legal Integrity Analytics</title>
    <!-- Premium Fonts: Cinzel for elegant serif, Montserrat for clean sans-serif -->
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=Montserrat:wght@300;400;500;600&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <script src="https://cdn.jsdelivr.net/particles.js/2.0.0/particles.min.js"></script>
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        gold: '#d4af37',
                        goldLight: '#f9e596',
                        dark: '#0a0a0a',
                    },
                    fontFamily: {
                        cinzel: ['Cinzel', 'serif'],
                        montserrat: ['Montserrat', 'sans-serif'],
                    }
                }
            }
        }
    </script>
    
    <style>
        :root {
            --gold-primary: #d4af37;
            --gold-light: #f9e596;
            --gold-dark: #aa771c;
        }

        body {
            background-color: #030303; /* Deepest black for contrast */
            color: #fff;
            overflow: hidden;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: 'Montserrat', sans-serif;
        }

        /* Vùng chứa Particles Container */
        #particles-js {
            position: absolute;
            width: 100%;
            height: 100%;
            z-index: 0;
            background: radial-gradient(circle at center, #111 0%, #000 100%);
        }

        /* Định dạng trực tiếp cho Canvas của Particles như bạn yêu cầu */
        .particles-js-canvas-el {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
        }

        .content-container {
            position: relative;
            z-index: 10;
            text-align: center;
            width: 100%;
            max-width: 1400px;
            padding: 2rem;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .target-date {
            font-family: 'Montserrat', sans-serif;
            font-size: 1rem;
            letter-spacing: 0.4em;
            color: var(--gold-light);
            text-transform: uppercase;
            margin-bottom: 3rem;
            opacity: 0.9;
            text-shadow: 0 0 10px rgba(249, 229, 150, 0.3);
        }

        .countdown-wrapper {
            display: flex;
            justify-content: center;
            align-items: center;
            flex-wrap: wrap;
            gap: 2rem;
        }

        .countdown-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            width: 140px;
            height: 160px;
            background: transparent; /* Nền hoàn toàn trong suốt */
            border: none;
            box-shadow: none;
            transition: transform 0.4s ease;
        }

        .countdown-item:hover {
            transform: translateY(-5px) scale(1.05);
        }

        .countdown-number {
            font-family: 'Cinzel', serif;
            font-size: 5rem;
            font-weight: 600;
            line-height: 1;
            /* Foil Gold Text Effect */
            background: linear-gradient(to bottom, #fff 0%, #f9e596 40%, #d4af37 80%, #aa771c 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            filter: drop-shadow(0px 4px 10px rgba(212,175,55,0.3));
        }

        .countdown-label {
            font-family: 'Montserrat', sans-serif;
            font-size: 0.85rem;
            font-weight: 500;
            text-transform: uppercase;
            letter-spacing: 0.3em;
            color: #999;
            margin-top: 1rem;
        }

        #final-message {
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            width: 100%;
        }

        .seq-hidden {
            opacity: 0;
            visibility: hidden;
        }

        .brand-logo {
            width: 35%;
            height: auto;
            margin-bottom: 2.5rem;
            filter: drop-shadow(0 0 25px rgba(212, 175, 55, 0.4));
        }

        .main-title-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            margin-bottom: 1.5rem;
        }

        .start-text {
            font-family: 'Montserrat', sans-serif;
            font-size: 1.2rem;
            font-weight: 400;
            letter-spacing: 0.8em;
            color: #ffffff;
            margin-bottom: 1rem;
            text-transform: uppercase;
            opacity: 0.8;
        }

        .brand-text {
            font-family: 'Cinzel', serif;
            font-size: 4.5rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            line-height: 1.1;
            text-align: center;
            background: linear-gradient(to right, #bf953f, #fcf6ba, #b38728, #fbf5b7, #aa771c);
            background-size: 200% auto;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: shine 5s linear infinite;
        }

        .sub-title {
            --target-spacing: 0.3em;
            font-family: 'Montserrat', sans-serif;
            font-size: 1.8rem;
            font-weight: 300;
            letter-spacing: var(--target-spacing);
            text-transform: uppercase;
            margin-bottom: 4rem;
            color: #fff;
            text-shadow: 0 0 10px rgba(255,255,255,0.3), 0 0 20px rgba(212, 175, 55, 0.4);
        }

        .today-date {
            font-family: 'Cinzel', serif;
            font-size: 1.5rem;
            font-weight: 600;
            letter-spacing: 0.15em;
            color: #fff;
            margin-bottom: 0.5rem;
            text-transform: uppercase;
        }

        /* ---------------------------------------------------
           PREMIUM ROYAL SEAL BUTTON (Nút Quý Tộc Vòng Nguyệt Quế)
           --------------------------------------------------- */
        .start-btn {
            position: relative;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 170px;
            height: 170px;
            border-radius: 50%;
            font-family: 'Cinzel', serif;
            font-size: 1.6rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.15em;
            color: #1a1100;
            text-decoration: none;
            background: radial-gradient(circle at 35% 35%, #fff5d1, #d4af37, #996a0c, #593d00);
            border: 2px solid #fff;
            cursor: pointer;
            overflow: hidden;
            transition: all 0.5s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: 
                0 15px 35px rgba(212, 175, 55, 0.4),
                inset 0 0 0 4px rgba(255, 255, 255, 0.6),
                inset 0 0 20px 10px rgba(0,0,0,0.3);
        }

        .btn-ornament {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            pointer-events: none;
            z-index: 1;
            transition: transform 10s linear;
        }

        .start-btn:hover .btn-ornament {
            transform: rotate(15deg);
        }

        .start-btn::after {
            content: '';
            position: absolute;
            top: 0;
            left: -150%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.8), transparent);
            transform: skewX(-25deg);
            transition: all 0.7s ease;
            z-index: 2;
        }

        .btn-text {
            position: relative;
            z-index: 3;
            text-shadow: 0 1px 2px rgba(255,255,255,0.8), 0 0 15px rgba(255, 255, 255, 0.5);
            padding-left: 0.15em; 
        }

        .start-btn:hover {
            transform: translateY(-5px) scale(1.05);
            box-shadow: 
                0 20px 50px rgba(212, 175, 55, 0.8),
                inset 0 0 0 4px rgba(255, 255, 255, 0.9),
                inset 0 0 20px 10px rgba(0,0,0,0.4);
            color: #000;
        }

        .start-btn:hover::after {
            left: 150%;
        }

        @keyframes shine {
            to { background-position: 200% center; }
        }

        @keyframes zoomInFade {
            0% { opacity: 0; transform: scale(0.8); visibility: visible; }
            100% { opacity: 1; transform: scale(1); visibility: visible; }
        }

        @keyframes epicTitleReveal {
            0% { opacity: 0; transform: scale(1.3) translateY(40px); filter: blur(20px) drop-shadow(0 0 0px rgba(212,175,55,0)); visibility: visible; }
            40% { opacity: 0.8; transform: scale(1.02) translateY(-5px); filter: blur(3px) drop-shadow(0 0 40px rgba(252,246,186,0.6)); }
            100% { opacity: 1; transform: scale(1) translateY(0); filter: blur(0) drop-shadow(0 0 15px rgba(212,175,55,0.3)); visibility: visible; }
        }

        @keyframes cinematicTrackingIn {
            0% { opacity: 0; letter-spacing: 1.2em; filter: blur(15px); transform: translateY(20px); visibility: visible; }
            100% { opacity: 1; letter-spacing: var(--target-spacing); filter: blur(0); transform: translateY(0); visibility: visible; }
        }

        @keyframes elegantGlowPulse {
            0%, 100% { text-shadow: 0 0 10px rgba(255,255,255,0.3), 0 0 20px rgba(212, 175, 55, 0.4); color: #fff; }
            50% { text-shadow: 0 0 20px rgba(255,255,255,0.8), 0 0 40px rgba(212, 175, 55, 0.9), 0 0 60px rgba(212, 175, 55, 0.5); color: #fffce0; }
        }

        @keyframes fadeIn {
            0% { opacity: 0; visibility: visible; }
            100% { opacity: 1; visibility: visible; }
        }

        @keyframes pulseGlow {
            0% { box-shadow: 0 10px 30px rgba(212, 175, 55, 0.3); }
            50% { box-shadow: 0 10px 50px rgba(212, 175, 55, 0.7); }
            100% { box-shadow: 0 10px 30px rgba(212, 175, 55, 0.3); }
        }

        /* ---------------------------------------------------
           BIG COUNTDOWN - 30S CUỐI CÙNG
           --------------------------------------------------- */
        .big-countdown-wrapper {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-shadow: 0 0 30px rgba(212,175,55,0.6), 0 0 80px rgba(255,255,255,0.2);
            margin-top: 2rem; 
        }

        /* NEW HEADER TEXTS FOR 30S */
        .big-header-texts {
            text-align: center;
            margin-bottom: 0;
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }

        .big-text-ready {
            font-family: 'Montserrat', sans-serif;
            font-size: 2.5rem;
            font-weight: 600;
            letter-spacing: 0.6em;
            color: var(--gold-light);
            text-transform: uppercase;
            margin-bottom: 0.5rem;
            text-shadow: 0 0 15px rgba(249, 229, 150, 0.5);
        }

        .big-text-line1 {
            font-family: 'Cinzel', serif;
            font-size: 3.2rem;
            font-weight: 700;
            letter-spacing: 0.15em;
            text-transform: uppercase;
            background: linear-gradient(to right, #bf953f, #fcf6ba, #b38728, #fbf5b7, #aa771c);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 0 25px rgba(212, 175, 55, 0.4);
        }

        .big-text-line2 {
            font-family: 'Montserrat', sans-serif;
            font-size: 1.6rem;
            font-weight: 300;
            letter-spacing: 0.3em;
            color: #ffffff;
            text-transform: uppercase;
            text-shadow: 0 2px 10px rgba(0,0,0,0.8);
        }

        .big-text-line3 {
            font-family: 'Montserrat', sans-serif;
            font-size: 1.1rem;
            font-weight: 500;
            letter-spacing: 0.4em;
            color: var(--gold-light);
            text-transform: uppercase;
            margin-top: 0.5rem;
            opacity: 0.9;
        }

        .big-sec-num {
            font-family: 'Cinzel', serif;
            font-size: 16rem;
            font-weight: 700;
            line-height: 0.85;
            color: transparent;
            /* Lịch sự, đẳng cấp: gradient vàng kim loại mượt mà + stroke mỏng tinh tế */
            -webkit-text-stroke: 2px #f9e596;
            background: linear-gradient(180deg, #ffffff 0%, #f9e596 25%, #d4af37 60%, #8a5c00 100%);
            -webkit-background-clip: text;
            filter: drop-shadow(0px 10px 25px rgba(212,175,55,0.8));
            display: inline-block;
        }

        /* ANIMATIONS FOR TICKING */
        @keyframes tickTextPing {
            0% { transform: scale(1.02); filter: drop-shadow(0 0 30px rgba(255,255,255,0.5)) brightness(1.2); }
            100% { transform: scale(1); filter: drop-shadow(0 0 10px rgba(212,175,55,0.2)) brightness(1); }
        }
        
        .tick-text-anim {
            animation: tickTextPing 0.9s cubic-bezier(0.2, 0.8, 0.2, 1) forwards;
        }

        @keyframes tickPing {
            0% { transform: scale(1.1); filter: drop-shadow(0 0 60px rgba(249, 229, 150, 0.9)) drop-shadow(0 0 20px #fff); }
            100% { transform: scale(1); filter: drop-shadow(0px 10px 25px rgba(212,175,55,0.8)); }
        }

        .tick-anim {
            animation: tickPing 0.9s cubic-bezier(0.2, 0.8, 0.2, 1) forwards;
        }

        @media (max-width: 1024px) {
            .big-text-ready { font-size: 1.2rem; }
            .big-text-line1 { font-size: 2.2rem; }
            .big-text-line2 { font-size: 1.2rem; }
            .big-sec-num { font-size: 13rem; }
        }

        @media (max-width: 768px) {
            .big-text-ready { font-size: 0.9rem; letter-spacing: 0.4em; }
            .big-text-line1 { font-size: 1.4rem; letter-spacing: 0.1em; }
            .big-text-line2 { font-size: 0.8rem; letter-spacing: 0.15em; }
            .big-text-line3 { font-size: 0.7rem; }
            .big-sec-num { font-size: 9rem; -webkit-text-stroke: 1px #d4af37; }
        }

        .anim-logo { animation: zoomInFade 2s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
        .anim-title { animation: epicTitleReveal 3s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
        .anim-subtitle { animation: cinematicTrackingIn 2.5s cubic-bezier(0.2, 0.8, 0.2, 1) forwards, elegantGlowPulse 4s ease-in-out infinite 2.5s; }
        .anim-btn { animation: fadeIn 2s ease-out forwards, pulseGlow 3s infinite 2s; }

        @media (max-width: 1024px) {
            .brand-text { font-size: 3.5rem; }
            .countdown-item { width: 130px; height: 150px; }
            .countdown-number { font-size: 4rem; }
        }

        @media (max-width: 768px) {
            .today-date { font-size: 1rem; letter-spacing: 0.1em; margin-bottom: 0.25rem; }
            .target-date { font-size: 0.8rem; letter-spacing: 0.2em; }
            .countdown-wrapper { gap: 1rem; }
            .countdown-item { width: 90px; height: 100px; padding: 0.5rem; }
            .countdown-number { font-size: 2.5rem; }
            .countdown-label { font-size: 0.7rem; }
            .brand-text { font-size: 2.2rem; }
            .start-text { font-size: 0.9rem; letter-spacing: 0.4em; }
            .sub-title { font-size: 1rem; --target-spacing: 0.15em; }
            .start-btn { width: 140px; height: 140px; font-size: 1.3rem; }
        }
    </style>
</head>
<body>

    <!-- Background Particles -->
    <div id="particles-js"></div>
    
    <!-- Independent Canvas for Fireworks -->
    <canvas id="confetti-canvas" class="fixed top-0 left-0 w-full h-full pointer-events-none z-[9999]"></canvas>

    <div class="content-container">
        
        <!-- Countdown Section -->
        <div id="countdown-container" class="flex flex-col justify-center items-center w-full">
            <div class="target-date">
                <div id="english-date" class="today-date"></div>
                Grand Opening • 19:00 (GMT+7)
            </div>
            <div class="countdown-wrapper">
                <div class="countdown-item">
                    <span class="countdown-number" id="days">00</span>
                    <span class="countdown-label">Days</span>
                </div>
                <div class="countdown-item">
                    <span class="countdown-number" id="hours">00</span>
                    <span class="countdown-label">Hours</span>
                </div>
                <div class="countdown-item">
                    <span class="countdown-number" id="minutes">00</span>
                    <span class="countdown-label">Minutes</span>
                </div>
                <div class="countdown-item">
                    <span class="countdown-number" id="seconds">00</span>
                    <span class="countdown-label">Seconds</span>
                </div>
            </div>
        </div>

        <!-- BIG 30S COUNTDOWN (Sẽ ẩn lúc đầu) -->
        <div id="big-countdown" class="hidden flex-col justify-center items-center w-full">
            <div class="big-header-texts" id="big-header-anim">
                <div class="big-text-line1">LEGAL INTEGRITY ANALYTICS</div>
                <div class="big-text-line2">Module A - Pre-Action Assessment</div>
                <div class="big-text-line3" id="big-english-date"></div>
            </div>
            <div class="big-countdown-wrapper">
                <div class="big-text-ready" id="big-ready-anim">Get Ready</div>
                <span id="big-sec-num" class="big-sec-num">30</span>
            </div>
        </div>

        <!-- End Screen Section -->
        <div id="final-message">
            <img src="https://legalintegrityanalytics.com/assets/lia/images/background/unnamed.webp" id="reveal-logo" alt="Legal Integrity Analytics Logo" class="brand-logo seq-hidden" onerror="this.src='https://placehold.co/400x400/d4af37/000?text=LIA'">
            
            <div id="reveal-title" class="main-title-container seq-hidden">
                <span class="start-text">- Start -</span>
                <span class="brand-text">Legal Integrity Analytics</span>
            </div>
            
            <h2 id="reveal-subtitle" class="sub-title seq-hidden">Smooth Run & Big Wins</h2>
            
            <a href="https://legalintegrityanalytics.com" id="reveal-btn" class="start-btn seq-hidden">
                <svg class="btn-ornament" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
                    <defs>
                        <filter id="shadow3d" x="-30%" y="-30%" width="160%" height="160%">
                            <feDropShadow dx="2" dy="4" stdDeviation="3" flood-color="#000" flood-opacity="0.7"/>
                            <feDropShadow dx="-1" dy="-1" stdDeviation="1.5" flood-color="#fff" flood-opacity="0.3"/>
                        </filter>
                        
                        <linearGradient id="gold-3d" x1="0%" y1="0%" x2="100%" y2="100%">
                            <stop offset="0%" stop-color="#fff5d1" />
                            <stop offset="30%" stop-color="#d4af37" />
                            <stop offset="70%" stop-color="#8a5c00" />
                            <stop offset="100%" stop-color="#3d2800" />
                        </linearGradient>

                        <linearGradient id="gold-3d-dark" x1="0%" y1="100%" x2="100%" y2="0%">
                            <stop offset="0%" stop-color="#e6c55c" />
                            <stop offset="50%" stop-color="#8a5c00" />
                            <stop offset="100%" stop-color="#1f1400" />
                        </linearGradient>

                        <g id="wheat-segment">
                            <path d="M -5 0 L 20 0" stroke="url(#gold-3d-dark)" stroke-width="2.5" stroke-linecap="round" filter="url(#shadow3d)"/>
                            <path d="M 0 0 C 8 -14, 22 -17, 28 -4 C 20 -2, 10 -1, 0 0 Z" fill="url(#gold-3d)" filter="url(#shadow3d)"/>
                            <path d="M 0 0 Q 14 -10, 26 -4" fill="none" stroke="#3d2800" stroke-width="0.75" opacity="0.6"/>
                            <path d="M 5 0 C 12 12, 24 15, 30 3 C 22 1, 14 0, 5 0 Z" fill="url(#gold-3d-dark)" filter="url(#shadow3d)"/>
                            <path d="M 5 0 Q 18 10, 28 3" fill="none" stroke="#fffce0" stroke-width="0.5" opacity="0.4"/>
                            <path d="M 28 -4 Q 45 -18, 55 -8" fill="none" stroke="#fffce0" stroke-width="1" filter="url(#shadow3d)"/>
                            <path d="M 30 3 Q 45 15, 55 5" fill="none" stroke="#d4af37" stroke-width="0.5" filter="url(#shadow3d)"/>
                            <circle cx="28" cy="-4" r="1.5" fill="#fff" filter="url(#shadow3d)"/>
                        </g>
                        
                        <g id="ribbon">
                            <path d="M -20 25 C -10 15, -5 5, 0 0 C 5 5, 10 15, 20 25 C 10 20, 0 10, -20 25 Z" fill="url(#gold-3d)" filter="url(#shadow3d)"/>
                            <circle cx="0" cy="0" r="5" fill="url(#gold-3d-dark)" filter="url(#shadow3d)"/>
                        </g>
                    </defs>

                    <circle cx="100" cy="100" r="94" fill="none" stroke="rgba(255,255,255,0.4)" stroke-width="1"/>
                    <circle cx="100" cy="100" r="88" fill="none" stroke="rgba(0,0,0,0.2)" stroke-width="3" filter="url(#shadow3d)"/>
                    <circle cx="100" cy="100" r="50" fill="none" stroke="rgba(0,0,0,0.3)" stroke-width="1.5" filter="url(#shadow3d)"/>
                    <circle cx="100" cy="100" r="46" fill="none" stroke="rgba(255,255,255,0.5)" stroke-width="1" stroke-dasharray="2 3"/>

                    <g id="left-wreath">
                        <use href="#wheat-segment" transform="translate(100,100) rotate(105) translate(70,0) rotate(90)" />
                        <use href="#wheat-segment" transform="translate(100,100) rotate(120) translate(70,0) rotate(90)" />
                        <use href="#wheat-segment" transform="translate(100,100) rotate(135) translate(70,0) rotate(90)" />
                        <use href="#wheat-segment" transform="translate(100,100) rotate(150) translate(70,0) rotate(90)" />
                        <use href="#wheat-segment" transform="translate(100,100) rotate(165) translate(70,0) rotate(90)" />
                        <use href="#wheat-segment" transform="translate(100,100) rotate(180) translate(70,0) rotate(90)" />
                        <use href="#wheat-segment" transform="translate(100,100) rotate(195) translate(70,0) rotate(90)" />
                        <use href="#wheat-segment" transform="translate(100,100) rotate(210) translate(70,0) rotate(90)" />
                        <use href="#wheat-segment" transform="translate(100,100) rotate(225) translate(70,0) rotate(90)" />
                        <use href="#wheat-segment" transform="translate(100,100) rotate(240) translate(70,0) rotate(90)" />
                        <use href="#wheat-segment" transform="translate(100,100) rotate(255) translate(70,0) rotate(90)" />
                    </g>

                    <g id="right-wreath">
                        <use href="#wheat-segment" transform="translate(100,100) rotate(75) translate(70,0) rotate(-90) scale(1,-1)" />
                        <use href="#wheat-segment" transform="translate(100,100) rotate(60) translate(70,0) rotate(-90) scale(1,-1)" />
                        <use href="#wheat-segment" transform="translate(100,100) rotate(45) translate(70,0) rotate(-90) scale(1,-1)" />
                        <use href="#wheat-segment" transform="translate(100,100) rotate(30) translate(70,0) rotate(-90) scale(1,-1)" />
                        <use href="#wheat-segment" transform="translate(100,100) rotate(15) translate(70,0) rotate(-90) scale(1,-1)" />
                        <use href="#wheat-segment" transform="translate(100,100) rotate(0) translate(70,0) rotate(-90) scale(1,-1)" />
                        <use href="#wheat-segment" transform="translate(100,100) rotate(345) translate(70,0) rotate(-90) scale(1,-1)" />
                        <use href="#wheat-segment" transform="translate(100,100) rotate(330) translate(70,0) rotate(-90) scale(1,-1)" />
                        <use href="#wheat-segment" transform="translate(100,100) rotate(315) translate(70,0) rotate(-90) scale(1,-1)" />
                        <use href="#wheat-segment" transform="translate(100,100) rotate(300) translate(70,0) rotate(-90) scale(1,-1)" />
                        <use href="#wheat-segment" transform="translate(100,100) rotate(285) translate(70,0) rotate(-90) scale(1,-1)" />
                    </g>

                    <use href="#ribbon" transform="translate(100, 170)" />
                </svg>
                <span class="btn-text">START</span>
            </a>
        </div>
    </div>

    <script>
        // Init Particles JS
        particlesJS('particles-js', {
            "particles": {
                "number": { "value": 60, "density": { "enable": true, "value_area": 1000 } },
                "color": { "value": "#d4af37" },
                "shape": { "type": "circle" },
                "opacity": { "value": 0.3, "random": true, "anim": { "enable": true, "speed": 0.5, "opacity_min": 0.1, "sync": false } },
                "size": { "value": 3, "random": true },
                "line_linked": { "enable": false },
                "move": { "enable": true, "speed": 0.8, "direction": "top", "random": true, "straight": false, "out_mode": "out" }
            },
            "interactivity": {
                "detect_on": "window",
                "events": { "onhover": { "enable": true, "mode": "bubble" }, "onclick": { "enable": false } },
                "modes": { "bubble": { "distance": 250, "size": 4, "duration": 2, "opacity": 1, "speed": 3 } }
            },
            "retina_detect": true
        });

        // ---------------------------------------------------------
        // THỜI GIAN THỰC TẾ: 19:00 HÔM NAY (GMT+7)
        // ---------------------------------------------------------
        let isLaunched = false;
        
        const initDateDisplay = () => {
            const now = new Date();
            // Lấy thời gian UTC và chuyển đổi sang GMT+7 (Việt Nam)
            const utc = now.getTime() + (now.getTimezoneOffset() * 60000);
            const vnTime = new Date(utc + (3600000 * 7));
            
            const options = { weekday: 'long', month: 'long', day: 'numeric', year: 'numeric' };
            const formattedDate = vnTime.toLocaleDateString('en-US', options).toUpperCase();
            
            document.getElementById('english-date').innerText = formattedDate;
            document.getElementById('big-english-date').innerText = formattedDate;
        };
        initDateDisplay(); // Gọi ngay khi load

        const updateTimerDisplay = (days, hours, minutes, seconds) => {
            document.getElementById('days').innerText = String(days).padStart(2, '0');
            document.getElementById('hours').innerText = String(hours).padStart(2, '0');
            document.getElementById('minutes').innerText = String(minutes).padStart(2, '0');
            document.getElementById('seconds').innerText = String(seconds).padStart(2, '0');
        };

        // Hàm tính toán mục tiêu 19:00 giờ Việt Nam (GMT+7) của ngày hiện tại
        const getTargetTimestamp = () => {
            const now = new Date();
            
            // Ép múi giờ hiển thị về Việt Nam để lấy đúng "Ngày hôm nay" ở VN
            const formatter = new Intl.DateTimeFormat('en-US', {
                timeZone: 'Asia/Ho_Chi_Minh',
                year: 'numeric',
                month: '2-digit',
                day: '2-digit'
            });
            
            const parts = formatter.formatToParts(now);
            const year = parts.find(p => p.type === 'year').value;
            const month = parts.find(p => p.type === 'month').value;
            const day = parts.find(p => p.type === 'day').value;
            
            // Tạo chuỗi thời gian chuẩn xác cho 19:00:00 GMT+7 (+07:00)
            const targetString = `${year}-${month}-${day}T19:00:00+07:00`;
            
            return new Date(targetString).getTime();
        };

        const targetTimestamp = getTargetTimestamp();

        const calculateTimeLeft = () => {
            return targetTimestamp - Date.now();
        };

        let lastSecond = -1;

        // Đẩy nhanh tốc độ chạy interval để bắt khung hình chuyển giây mượt nhất
        const interval = setInterval(function() {
            const diff = calculateTimeLeft();

            if (diff <= 0) {
                clearInterval(interval);
                updateTimerDisplay(0, 0, 0, 0);
                if(!isLaunched) {
                    isLaunched = true;
                    triggerLaunchSequence();
                }
                return;
            }

            const totalSecondsLeft = Math.ceil(diff / 1000);

            // LOGIC KIỂM TRA 30 GIÂY CUỐI
            if (totalSecondsLeft <= 30 && totalSecondsLeft > 0) {
                // 1. Ẩn bộ đếm nhỏ
                document.getElementById('countdown-container').style.display = 'none';
                
                // 2. Hiện bộ đếm Khổng Lồ
                const bigContainer = document.getElementById('big-countdown');
                if (bigContainer.classList.contains('hidden')) {
                    bigContainer.classList.remove('hidden');
                    bigContainer.style.display = 'flex';
                }
                
                const bigNum = document.getElementById('big-sec-num');
                const bigHeader = document.getElementById('big-header-anim');
                const bigReady = document.getElementById('big-ready-anim');
                
                // 3. Cập nhật số & Nháy animation mỗi giây
                if (lastSecond !== totalSecondsLeft) {
                    lastSecond = totalSecondsLeft;
                    bigNum.innerText = String(totalSecondsLeft).padStart(2, '0');
                    
                    // Reset animation để kích hoạt lại hiệu ứng nhịp tim (ping) cho cả số và text
                    bigNum.classList.remove('tick-anim');
                    bigHeader.classList.remove('tick-text-anim');
                    if (bigReady) bigReady.classList.remove('tick-text-anim');
                    
                    void bigNum.offsetWidth; // trigger reflow
                    void bigHeader.offsetWidth; // trigger reflow
                    if (bigReady) void bigReady.offsetWidth; // trigger reflow
                    
                    bigNum.classList.add('tick-anim');
                    bigHeader.classList.add('tick-text-anim');
                    if (bigReady) bigReady.classList.add('tick-text-anim');
                }
            } else {
                // Đếm ngược thông thường
                const d = Math.floor(diff / (1000 * 60 * 60 * 24));
                const h = Math.floor((diff % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
                const m = Math.floor((diff % (1000 * 60 * 60)) / (1000 * 60));
                const s = Math.floor((diff % (1000 * 60)) / 1000);

                updateTimerDisplay(d, h, m, s);
            }
        }, 50);

        // SEQUENCE CÁC SỰ KIỆN NỔ PHÁO HOA & HIỆN LOGO
        function triggerLaunchSequence() {
            const countdownEl = document.getElementById('countdown-container');
            const bigCountdownEl = document.getElementById('big-countdown');
            
            // Xóa mờ cả bộ đếm nhỏ và bộ đếm to
            countdownEl.style.transition = 'all 1s cubic-bezier(0.4, 0, 0.2, 1)';
            countdownEl.style.opacity = '0';
            countdownEl.style.transform = 'scale(0.95)';
            
            bigCountdownEl.style.transition = 'all 1s cubic-bezier(0.4, 0, 0.2, 1)';
            bigCountdownEl.style.opacity = '0';
            bigCountdownEl.style.transform = 'scale(0.95)';
            bigCountdownEl.style.filter = 'blur(10px)';
            
            setTimeout(() => {
                countdownEl.style.display = 'none';
                bigCountdownEl.style.display = 'none';
                
                const finalMsgEl = document.getElementById('final-message');
                finalMsgEl.style.display = 'flex';
                
                launchBeautifulFireworks();

                setTimeout(() => {
                    document.getElementById('reveal-logo').classList.add('anim-logo');
                }, 500);

                setTimeout(() => {
                    document.getElementById('reveal-title').classList.add('anim-title');
                }, 1500);

                setTimeout(() => {
                    document.getElementById('reveal-subtitle').classList.add('anim-subtitle');
                }, 2500);

                setTimeout(() => {
                    document.getElementById('reveal-btn').classList.add('anim-btn');
                }, 4000);

            }, 1000);
        }

        function launchBeautifulFireworks() {
            var myCanvas = document.getElementById('confetti-canvas');
            
            // Fix: Đặt useWorker: false để tránh lỗi getBoundingClientRect trên OffscreenCanvas
            var myConfetti = confetti.create(myCanvas, { 
                resize: true, 
                useWorker: false 
            });

            var duration = 15 * 1000;
            var animationEnd = Date.now() + duration;
            var colors = ['#d4af37', '#ffffff', '#ffd700', '#f9e596', '#e6c55c'];

            function randomInRange(min, max) {
                return Math.random() * (max - min) + min;
            }

            // The Big Bang
            myConfetti({ particleCount: 250, spread: 180, origin: { y: 0.5 }, colors: colors, startVelocity: 55, shapes: ['circle'], scalar: 1.2 });
            myConfetti({ particleCount: 150, spread: 160, origin: { y: 0.5 }, colors: ['#ffffff', '#f9e596'], startVelocity: 45, shapes: ['star'], scalar: 1.5 });

            var burstInterval = setInterval(function() {
                var timeLeft = animationEnd - Date.now();

                if (timeLeft <= 0) {
                    return clearInterval(burstInterval);
                }

                var particleCount = 40 * (timeLeft / duration);
                
                myConfetti({ particleCount, startVelocity: 35, spread: 80, angle: 60, origin: { x: 0, y: randomInRange(0.5, 0.8) }, colors: colors, shapes: ['circle'] });
                myConfetti({ particleCount, startVelocity: 35, spread: 80, angle: 120, origin: { x: 1, y: randomInRange(0.5, 0.8) }, colors: colors, shapes: ['circle'] });

                if (Math.random() > 0.6) {
                    myConfetti({
                        particleCount: 25,
                        spread: 120,
                        startVelocity: 25,
                        origin: { x: randomInRange(0.1, 0.9), y: randomInRange(0.1, 0.6) },
                        colors: ['#ffffff', '#f9e596'],
                        shapes: ['star'],
                        scalar: randomInRange(0.8, 1.5)
                    });
                }
            }, 300);
        }
    </script>
</body>
</html>
